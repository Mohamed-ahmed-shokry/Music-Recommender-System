[project]
name = "music-recommender-system"
version = "0.4.0"
description = "Production-style hybrid artist recommendations with ALS and metadata."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [
    { name = "Mohamed Ahmed Shokry" },
]
keywords = [
    "collaborative-filtering",
    "implicit-feedback",
    "machine-learning",
    "music-recommendation",
    "recommender-system",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.139.2",
    "idna>=3.15",
    "implicit>=0.7.3",
    "joblib>=1.5.3",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "typer>=0.25.1",
    "uvicorn>=0.46.0",
]

[project.scripts]
music-recommender = "music_recommender.cli:app"

[project.urls]
Homepage = "https://github.com/Mohamed-ahmed-shokry/Music-Recommender-System"
Issues = "https://github.com/Mohamed-ahmed-shokry/Music-Recommender-System/issues"
Repository = "https://github.com/Mohamed-ahmed-shokry/Music-Recommender-System"

[project.optional-dependencies]
gpu = [
    "implicit[gpu]>=0.7.3",
]
dashboard = [
    "streamlit>=1.59.2",
]
tracking = [
    "mlflow-skinny>=3.14.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "mypy>=2.3.0",
    "pre-commit>=4.3.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_recommender", "api"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
files = ["src", "api"]
ignore_missing_imports = true
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
addopts = """
    --strict-config
    --strict-markers
"""
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["music_recommender", "api"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
