# Prometheus Server Configuration for Music Recommender System
# Scrapes metrics from the FastAPI service at /metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "music_recommender"
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["localhost:8000"]
        labels:
          environment: "production"
          service: "music-recommender"
          region: "us-east-1"
