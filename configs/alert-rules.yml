# Prometheus alerting rules for the Music Recommender System.
# GENERATED from music_recommender.alerting.DEFAULT_ALERT_RULES.
# Regenerate with:
#   uv run python -m music_recommender.alerting configs/alert-rules.yml
groups:
  - name: music_recommender_alerts
    interval: 15s
    rules:
      - alert: ServiceDown
        expr: "music_recommender_up == 0"
        labels:
          severity: critical
        annotations:
          summary: "Recommender service is unavailable (artifacts not loaded)."
      - alert: StreamingHealthDegraded
        expr: "music_recommender_streaming_health{status=\"degraded\"} == 1"
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Streaming feedback pipeline health is degraded."
      - alert: StreamingHealthUnhealthy
        expr: "music_recommender_streaming_health{status=\"unhealthy\"} == 1"
        labels:
          severity: critical
        annotations:
          summary: "Streaming feedback pipeline health is unhealthy."
      - alert: StreamingQueueHighUtilization
        expr: "music_recommender_streaming_queue_utilization_ratio >= 0.8"
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Streaming feedback queue is above 80% utilization."
      - alert: StreamingRecordsDropped
        expr: "increase(music_recommender_streaming_records_dropped_total[5m]) > 0"
        labels:
          severity: critical
        annotations:
          summary: "Feedback records are being dropped by queue backpressure."
      - alert: StreamingFlushErrors
        expr: "increase(music_recommender_streaming_flush_errors_total[5m]) > 0"
        labels:
          severity: critical
        annotations:
          summary: "Streaming feedback batch flushes are failing."
      - alert: MaintenanceWorkerStopped
        expr: "music_recommender_maintenance_running == 0"
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Bandit maintenance worker is configured but not running."
      - alert: MaintenanceSweepErrors
        expr: "increase(music_recommender_maintenance_errors_total[5m]) > 0"
        labels:
          severity: warning
        annotations:
          summary: "Bandit maintenance sweeps are raising errors."
      - alert: BanditDriftViolation
        expr: "increase(music_recommender_maintenance_drift_violations_total[5m]) > 0"
        labels:
          severity: warning
        annotations:
          summary: "Bandit policy drift guardrail breach detected."
      - alert: BanditAutoRollback
        expr: "increase(music_recommender_maintenance_rollbacks_total[5m]) > 0"
        labels:
          severity: critical
        annotations:
          summary: "Bandit policy was automatically rolled back to the champion."
