name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install locked dependencies
        run: uv sync --locked --extra dashboard --extra tracking --extra spotify --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run --extra dashboard --extra tracking --extra spotify pytest --cov

      - name: Build distributions
        run: uv build

  container:
    name: Build and smoke test container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build image
        run: docker build --tag music-recommender-api:ci .

      - name: Verify API health
        run: |
          container_id="$(docker run \
            --detach \
            --name music-recommender-api-ci \
            --publish 127.0.0.1:8000:8000 \
            music-recommender-api:ci)"
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done

          echo "Container did not become healthy within 30 seconds." >&2
          exit 1

      - name: Build dashboard image
        run: |
          docker build \
            --target dashboard-runtime \
            --tag music-recommender-dashboard:ci \
            .

      - name: Verify dashboard health
        run: |
          container_id="$(docker run \
            --detach \
            --name music-recommender-dashboard-ci \
            --publish 127.0.0.1:8501:8501 \
            music-recommender-dashboard:ci)"
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done

          echo "Dashboard did not become healthy within 30 seconds." >&2
          exit 1
